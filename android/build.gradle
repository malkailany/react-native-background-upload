buildscript {
    // Use root project's values or fallback to defaults
    ext {
        kotlinVersion = rootProject.ext.has('kotlinVersion') ? rootProject.ext.kotlinVersion : '1.9.23'
        buildToolsVersion = rootProject.ext.has('buildToolsVersion') ? rootProject.ext.buildToolsVersion : '34.0.0'
        compileSdkVersion = rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34
        targetSdkVersion = rootProject.ext.has('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34
        minSdkVersion = rootProject.ext.has('minSdkVersion') ? rootProject.ext.minSdkVersion : 23
    }

    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        // Use the gradle plugin version from root project if available
        def gradlePluginVersion = rootProject.ext.has('gradlePluginVersion') ? rootProject.ext.gradlePluginVersion : '8.2.1'
        classpath "com.android.tools.build:gradle:${gradlePluginVersion}"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'

android {
    namespace "com.vydia.RNUploader"
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }

    lintOptions {
        abortOnError false
    }
}

repositories {
    mavenCentral()
    google()
}

def getExtOrDefault(name, defaultValue) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : defaultValue
}

dependencies {
    // Use versions from root project if available, otherwise use reasonable defaults
    def coreKtxVersion = getExtOrDefault('coreKtxVersion', '1.12.0')
    def uploadServiceVersion = getExtOrDefault('uploadServiceVersion', '4.9.3')
    def swipeRefreshVersion = getExtOrDefault('swipeRefreshVersion', '1.1.0')

    implementation "androidx.core:core-ktx:${coreKtxVersion}"
    implementation 'com.facebook.react:react-native:+'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlinVersion"
    implementation "net.gotev:uploadservice:${uploadServiceVersion}"
    implementation "net.gotev:uploadservice-okhttp:${uploadServiceVersion}"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:${swipeRefreshVersion}"
}